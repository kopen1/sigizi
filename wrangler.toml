name = "sigizi"
main = "worker/index.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# Buat KV: npx wrangler kv namespace create SIGIZI_KV
# lalu isi id di bawah dengan hasilnya.
[[kv_namespaces]]
binding = "KV"
id = "e347759a6d0749f9a24afcd8f8a17ecc"

[vars]
SIGIZI_ENDPOINT = "https://sigizikesga.kemkes.go.id"
